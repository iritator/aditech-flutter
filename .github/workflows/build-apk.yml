name: Build Aditech APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --org com.aditech --project-name aditech --platforms=android app

      - name: Create Aditech app
        run: |
          cat > app/lib/main.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';

          void main() => runApp(const Aditech());

          class Aditech extends StatelessWidget {
            const Aditech({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const ChatPage(),
              );
            }
          }

          class ChatPage extends StatefulWidget {
            const ChatPage({super.key});

            @override
            State<ChatPage> createState() => _ChatPageState();
          }

          class _ChatPageState extends State<ChatPage> {
            final input = TextEditingController();
            final messages = <Map<String, String>>[
              {
                'role': 'system',
                'content': 'You are Aditech, a helpful AI assistant.'
              }
            ];
            bool loading = false;

            Future<void> send() async {
              final text = input.text.trim();
              if (text.isEmpty || loading) return;

              input.clear();
              setState(() {
                messages.add({'role': 'user', 'content': text});
                loading = true;
              });

              try {
                final client = HttpClient();
                final request = await client.postUrl(
                  Uri.parse('http://127.0.0.1:8080/v1/chat/completions'),
                );
                request.headers.contentType = ContentType.json;
                request.add(utf8.encode(jsonEncode({
                  'messages': messages,
                  'max_tokens': 300
                })));

                final response = await request.close();
                final body = await response.transform(utf8.decoder).join();
                client.close();

                final data = jsonDecode(body);
                final reply = data['choices'][0]['message']['content'];

                setState(() {
                  messages.add({'role': 'assistant', 'content': reply});
                });
              } catch (e) {
                setState(() {
                  messages.add({
                    'role': 'assistant',
                    'content': 'Connection error. Please start the Aditech AI server in Termux.'
                  });
                });
              }

              setState(() => loading = false);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Aditech AI'),
                  backgroundColor: Colors.deepPurple,
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: ListView.builder(
                        padding: const EdgeInsets.all(12),
                        itemCount: messages.length - 1,
                        itemBuilder: (context, index) {
                          final msg = messages[index + 1];
                          final user = msg['role'] == 'user';
                          return Align(
                            alignment: user
                                ? Alignment.centerRight
                                : Alignment.centerLeft,
                            child: Container(
                              margin: const EdgeInsets.symmetric(vertical: 6),
                              padding: const EdgeInsets.all(14),
                              constraints: const BoxConstraints(maxWidth: 300),
                              decoration: BoxDecoration(
                                color: user
                                    ? Colors.deepPurple
                                    : Colors.grey.shade800,
                                borderRadius: BorderRadius.circular(16),
                              ),
                              child: Text(msg['content'] ?? ''),
                            ),
                          );
                        },
                      ),
                    ),
                    if (loading)
                      const Padding(
                        padding: EdgeInsets.all(8),
                        child: CircularProgressIndicator(),
                      ),
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: Row(
                        children: [
                          Expanded(
                            child: TextField(
                              controller: input,
                              decoration: const InputDecoration(
                                hintText: 'Message Aditech...',
                                border: OutlineInputBorder(),
                              ),
                              onSubmitted: (_) => send(),
                            ),
                          ),
                          IconButton(
                            onPressed: send,
                            icon: const Icon(Icons.send),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          DART

      - name: Configure Android internet
        run: |
          python3 - <<'PY'
          p = 'app/android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          open(p, 'w').write(s)
          PY

      - name: Build APK
        run: |
          cd app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aditech-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
