name: Build ADITECH 3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --org com.aditech --project-name aditech --platforms=android app

      - name: Install packages
        run: |
          cd app
          flutter pub add speech_to_text flutter_tts image_picker shared_preferences flutter_markdown

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>
          """

          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", permissions + "\n    <application", 1)

          s = s.replace(
              "<application",
              '<application android:usesCleartextTraffic="true"',
              1
          )

          p.write_text(s)
          PY

      - name: Create ADITECH application
        run: |
          mkdir -p app/lib

          cat > app/lib/main.dart <<'DART'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_markdown/flutter_markdown.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const AditechApp());
          }

          enum AssistantStatus {
            idle,
            listening,
            thinking,
            generating,
            speaking,
            completed,
            error,
          }

          class AditechApp extends StatelessWidget {
            const AditechApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'ADITECH',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF080B14),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF00D9FF),
                  ),
                  useMaterial3: true,
                ),
                home: const ChatScreen(),
              );
            }
          }

          class ChatScreen extends StatefulWidget {
            const ChatScreen({super.key});

            @override
            State<ChatScreen> createState() => _ChatScreenState();
          }

          class _ChatScreenState extends State<ChatScreen> {
            final TextEditingController controller =
                TextEditingController();

            final ScrollController scrollController =
                ScrollController();

            final stt.SpeechToText speech = stt.SpeechToText();

            final FlutterTts tts = FlutterTts();

            final ImagePicker imagePicker = ImagePicker();

            final List<Map<String, String>> messages = [];

            HttpClient? activeClient;

            XFile? selectedImage;

            AssistantStatus status = AssistantStatus.idle;

            bool loading = false;
            bool listening = false;
            bool speechAvailable = false;

            String selectedLanguage = 'auto';

            static const String textApiUrl =
                'http://127.0.0.1:8080/v1/chat/completions';

            static const String visionApiUrl =
                'http://127.0.0.1:8081/v1/chat/completions';

            static const String historyKey = 'aditech_chat_history';

            static const String systemPrompt = '''
          You are ADIRUTI, the personal AI assistant inside ADITECH.

          CREATOR: ADI
          AI IDENTITY: ADI IDEOLOGY
          AI BRAND: IRITATOR

          PERSONALITY:
          Be caring, supportive, intelligent, friendly and emotionally aware.
          Listen carefully and understand the user's feelings.
          Never encourage emotional dependence or claim to be human.
          Be honest about your abilities and limitations.

          LANGUAGE:
          1. Understand Hindi, English and Hinglish.
          2. If the user writes Hindi in English letters, reply in Roman Hindi.
          3. If the user writes English, reply in simple English.
          4. If the user writes Hindi in Devanagari, reply in Hindi.
          5. Follow the user's language naturally.
          6. Avoid unnecessarily difficult vocabulary.

          VISION:
          When an image is provided, carefully inspect its visible contents.
          Answer questions about the image.
          For educational images, explain the visible question clearly.
          Never pretend to see an image that was not provided.

          RESPONSE STYLE:
          Use clear formatting, headings and lists when helpful.
          Be concise for simple questions and detailed for complex questions.
          Do not invent facts.
          ''';

            @override
            void initState() {
              super.initState();
              initializeVoice();
              loadHistory();
            }

            Future<void> loadHistory() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                final saved = prefs.getString(historyKey);

                if (saved == null) return;

                final decoded = jsonDecode(saved);

                if (decoded is List) {
                  if (!mounted) return;

                  setState(() {
                    messages.clear();

                    for (final item in decoded) {
                      if (item is Map) {
                        messages.add({
                          'role': item['role'].toString(),
                          'content': item['content'].toString(),
                        });
                      }
                    }
                  });

                  scrollToBottom();
                }
              } catch (e) {
                debugPrint('History load error: $e');
              }
            }

            Future<void> saveHistory() async {
              try {
                final prefs = await SharedPreferences.getInstance();

                await prefs.setString(
                  historyKey,
                  jsonEncode(messages),
                );
              } catch (e) {
                debugPrint('History save error: $e');
              }
            }

            Future<void> initializeVoice() async {
              try {
                speechAvailable = await speech.initialize(
                  onStatus: (value) {
                    if (!mounted) return;

                    if (value == 'notListening') {
                      setState(() {
                        listening = false;

                        if (status == AssistantStatus.listening) {
                          status = AssistantStatus.idle;
                        }
                      });
                    }
                  },
                  onError: (error) {
                    if (!mounted) return;

                    setState(() {
                      listening = false;
                      status = AssistantStatus.error;
                    });
                  },
                );

                await tts.setSpeechRate(0.45);
                await tts.setPitch(1.05);
                await tts.setVolume(1.0);
                await tts.awaitSpeakCompletion(true);

                if (mounted) setState(() {});
              } catch (e) {
                debugPrint('Voice initialization error: $e');
              }
            }

            Future<void> startListening() async {
              if (loading) return;

              if (!speechAvailable) {
                await initializeVoice();
              }

              if (!speechAvailable) {
                showMessage('Speech recognition is not available.');
                return;
              }

              if (listening) {
                await speech.stop();

                if (mounted) {
                  setState(() {
                    listening = false;
                    status = AssistantStatus.idle;
                  });
                }

                return;
              }

              await tts.stop();

              if (!mounted) return;

              setState(() {
                listening = true;
                status = AssistantStatus.listening;
              });

              try {
                final locale = selectedLanguage == 'hi_IN'
                    ? 'hi_IN'
                    : 'en_IN';

                await speech.listen(
                  localeId: locale,
                  listenFor: const Duration(seconds: 30),
                  pauseFor: const Duration(seconds: 3),
                  onResult: (result) {
                    if (!mounted) return;

                    setState(() {
                      controller.text = result.recognizedWords;

                      controller.selection =
                          TextSelection.fromPosition(
                        TextPosition(
                          offset: controller.text.length,
                        ),
                      );
                    });
                  },
                );
              } catch (e) {
                if (!mounted) return;

                setState(() {
                  listening = false;
                  status = AssistantStatus.error;
                });
              }
            }

            Future<void> pickImage(ImageSource source) async {
              if (loading) return;

              try {
                final XFile? image = await imagePicker.pickImage(
                  source: source,
                  imageQuality: 75,
                  maxWidth: 1280,
                  maxHeight: 1280,
                );

                if (image == null || !mounted) return;

                setState(() {
                  selectedImage = image;
                });
              } catch (e) {
                showMessage('Unable to select image: $e');
              }
            }

            Future<void> showImageOptions() async {
              if (loading) return;

              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF172438),
                builder: (context) {
                  return SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.all(18),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          ListTile(
                            leading: const Icon(
                              Icons.camera_alt,
                              color: Color(0xFF00D9FF),
                            ),
                            title: const Text('Open Camera'),
                            onTap: () {
                              Navigator.pop(context);
                              pickImage(ImageSource.camera);
                            },
                          ),
                          ListTile(
                            leading: const Icon(
                              Icons.photo_library,
                              color: Color(0xFF00D9FF),
                            ),
                            title: const Text('Choose from Gallery'),
                            onTap: () {
                              Navigator.pop(context);
                              pickImage(ImageSource.gallery);
                            },
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }

            Future<void> sendMessage() async {
              final userText = controller.text.trim();
              final image = selectedImage;

              if ((userText.isEmpty && image == null) || loading) {
                return;
              }

              if (listening) {
                await speech.stop();
              }

              await tts.stop();

              final actualText = userText.isEmpty
                  ? 'Please describe this image.'
                  : userText;

              setState(() {
                messages.add({
                  'role': 'user',
                  'content': actualText,
                });

                controller.clear();
                selectedImage = null;
                loading = true;
                listening = false;
                status = AssistantStatus.thinking;
              });

              scrollToBottom();
              await saveHistory();

              HttpClient? client;

              try {
                String? imageData;
                String? imageMime;

                if (image != null) {
                  final bytes = await image.readAsBytes();

                  imageData = base64Encode(bytes);

                  final extension =
                      image.name.split('.').last.toLowerCase();

                  imageMime = extension == 'png'
                      ? 'image/png'
                      : extension == 'webp'
                          ? 'image/webp'
                          : 'image/jpeg';
                }

                if (!mounted || !loading) return;

                setState(() {
                  status = AssistantStatus.generating;
                });

                client = HttpClient();
                activeClient = client;

                client.connectionTimeout =
                    const Duration(seconds: 20);

                final apiMessages = <Map<String, dynamic>>[
                  {
                    'role': 'system',
                    'content': systemPrompt,
                  },
                ];

                for (int i = 0; i < messages.length; i++) {
                  final message = messages[i];

                  if (imageData != null &&
                      i == messages.length - 1 &&
                      message['role'] == 'user') {
                    apiMessages.add({
                      'role': 'user',
                      'content': [
                        {
                          'type': 'text',
                          'text': message['content']!,
                        },
                        {
                          'type': 'image_url',
                          'image_url': {
                            'url':
                                'data:$imageMime;base64,$imageData',
                          },
                        },
                      ],
                    });
                  } else {
                    apiMessages.add({
                      'role': message['role'],
                      'content': message['content'],
                    });
                  }
                }

                final endpoint = imageData != null
                    ? visionApiUrl
                    : textApiUrl;

                final request = await client
                    .postUrl(Uri.parse(endpoint))
                    .timeout(const Duration(seconds: 30));

                request.headers.contentType = ContentType.json;

                request.write(jsonEncode({
                  'model': 'local-model',
                  'messages': apiMessages,
                  'temperature': 0.7,
                  'max_tokens': 512,
                  'stream': false,
                }));

                final response = await request.close().timeout(
                  const Duration(seconds: 180),
                );

                final responseBody = await response
                    .transform(utf8.decoder)
                    .join()
                    .timeout(const Duration(seconds: 180));

                if (response.statusCode < 200 ||
                    response.statusCode >= 300) {
                  throw Exception(
                    'Server error: ${response.statusCode}',
                  );
                }

                final data = jsonDecode(responseBody);

                final answer = data['choices'][0]['message']
                    ['content']
                    ?.toString()
                    .trim();

                if (answer == null || answer.isEmpty) {
                  throw Exception('Empty AI response');
                }

                if (!mounted || !loading) return;

                setState(() {
                  messages.add({
                    'role': 'assistant',
                    'content': answer,
                  });

                  loading = false;
                  status = AssistantStatus.completed;
                });

                await saveHistory();
                scrollToBottom();
              } catch (e) {
                debugPrint('AI connection error: $e');

                if (!mounted) return;

                if (loading) {
                  setState(() {
                    loading = false;
                    status = AssistantStatus.error;
                  });

                  showMessage(
                    'AI connection error. Check both Termux servers.',
                  );
                }
              } finally {
                if (identical(activeClient, client)) {
                  activeClient = null;
                }

                client?.close(force: true);
              }
            }

            Future<void> stopGeneration() async {
              activeClient?.close(force: true);

              if (!mounted) return;

              setState(() {
                loading = false;
                status = AssistantStatus.idle;
              });

              showMessage('Generation stopped.');
            }

            Future<void> speakResponse(String text) async {
              try {
                await tts.stop();

                if (!mounted) return;

                setState(() {
                  status = AssistantStatus.speaking;
                });

                final containsHindi =
                    RegExp(r'[\u0900-\u097F]').hasMatch(text);

                await tts.setLanguage(
                  containsHindi ? 'hi-IN' : 'en-IN',
                );

                await tts.speak(text);

                if (!mounted) return;

                setState(() {
                  status = AssistantStatus.completed;
                });
              } catch (e) {
                if (!mounted) return;

                setState(() {
                  status = AssistantStatus.error;
                });
              }
            }

            Future<void> stopSpeaking() async {
              await tts.stop();

              if (!mounted) return;

              setState(() {
                status = AssistantStatus.completed;
              });
            }

            Future<void> newChat() async {
              if (loading) {
                await stopGeneration();
              }

              await tts.stop();

              if (!mounted) return;

              setState(() {
                messages.clear();
                selectedImage = null;
                controller.clear();
                status = AssistantStatus.idle;
              });

              await saveHistory();
            }

            void copyResponse(String text) {
              Clipboard.setData(ClipboardData(text: text));
              showMessage('Response copied!');
            }

            void showMessage(String text) {
              if (!mounted) return;

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(text),
                  backgroundColor: const Color(0xFF182438),
                  behavior: SnackBarBehavior.floating,
                ),
              );
            }

            void scrollToBottom() {
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (scrollController.hasClients) {
                  scrollController.animateTo(
                    scrollController.position.maxScrollExtent,
                    duration: const Duration(milliseconds: 300),
                    curve: Curves.easeOut,
                  );
                }
              });
            }

            String get statusText {
              switch (status) {
                case AssistantStatus.idle:
                  return 'ADI IDEOLOGY READY';
                case AssistantStatus.listening:
                  return 'LISTENING';
                case AssistantStatus.thinking:
                  return 'THINKING';
                case AssistantStatus.generating:
                  return 'GENERATING';
                case AssistantStatus.speaking:
                  return 'SPEAKING';
                case AssistantStatus.completed:
                  return 'COMPLETED';
                case AssistantStatus.error:
                  return 'ERROR';
              }
            }

            Color get statusColor {
              switch (status) {
                case AssistantStatus.error:
                  return Colors.redAccent;
                case AssistantStatus.listening:
                  return Colors.orangeAccent;
                case AssistantStatus.speaking:
                  return Colors.purpleAccent;
                case AssistantStatus.completed:
                  return Colors.greenAccent;
                default:
                  return const Color(0xFF00D9FF);
              }
            }

            IconData get statusIcon {
              switch (status) {
                case AssistantStatus.listening:
                  return Icons.mic;
                case AssistantStatus.thinking:
                case AssistantStatus.generating:
                  return Icons.psychology;
                case AssistantStatus.speaking:
                  return Icons.volume_up;
                case AssistantStatus.completed:
                  return Icons.check_circle;
                case AssistantStatus.error:
                  return Icons.error_outline;
                default:
                  return Icons.auto_awesome;
              }
            }

            Widget buildStatusIndicator() {
              final active = loading ||
                  listening ||
                  status == AssistantStatus.speaking;

              return Container(
                padding: const EdgeInsets.symmetric(
                  horizontal: 12,
                  vertical: 9,
                ),
                decoration: BoxDecoration(
                  color: const Color(0xFF121B2C),
                  borderRadius: BorderRadius.circular(30),
                  border: Border.all(
                    color: statusColor.withOpacity(0.35),
                  ),
                ),
                child: Row(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Icon(
                      statusIcon,
                      size: 15,
                      color: statusColor,
                    ),
                    const SizedBox(width: 7),
                    Text(
                      statusText,
                      style: TextStyle(
                        fontSize: 9,
                        letterSpacing: 0.8,
                        fontWeight: FontWeight.bold,
                        color: statusColor,
                      ),
                    ),
                    if (active) ...[
                      const SizedBox(width: 7),
                      SizedBox(
                        width: 11,
                        height: 11,
                        child: CircularProgressIndicator(
                          strokeWidth: 2,
                          color: statusColor,
                        ),
                      ),
                    ],
                  ],
                ),
              );
            }

            Widget buildWelcome() {
              return Center(
                child: Padding(
                  padding: const EdgeInsets.all(25),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Container(
                        height: 95,
                        width: 95,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          gradient: const LinearGradient(
                            colors: [
                              Color(0xFF00D9FF),
                              Color(0xFF3156C9),
                            ],
                          ),
                          boxShadow: [
                            BoxShadow(
                              color: const Color(0xFF00D9FF)
                                  .withOpacity(0.25),
                              blurRadius: 35,
                            ),
                          ],
                        ),
                        child: const Icon(
                          Icons.auto_awesome,
                          size: 45,
                          color: Colors.white,
                        ),
                      ),
                      const SizedBox(height: 25),
                      const Text(
                        'HELLO, I AM ADIRUTI',
                        textAlign: TextAlign.center,
                        style: TextStyle(
                          fontSize: 22,
                          fontWeight: FontWeight.bold,
                          letterSpacing: 1,
                        ),
                      ),
                      const SizedBox(height: 10),
                      const Text(
                        'POWERED BY ADI IDEOLOGY',
                        style: TextStyle(
                          color: Color(0xFF00D9FF),
                          fontSize: 12,
                          letterSpacing: 1,
                        ),
                      ),
                      const SizedBox(height: 18),
                      const Text(
                        'Your personal AI assistant.\nHindi • English • Hinglish',
                        textAlign: TextAlign.center,
                        style: TextStyle(
                          color: Colors.white60,
                          height: 1.7,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget buildMessage(Map<String, String> message) {
              final isUser = message['role'] == 'user';
              final text = message['content'] ?? '';

              return Align(
                alignment: isUser
                    ? Alignment.centerRight
                    : Alignment.centerLeft,
                child: Container(
                  constraints: const BoxConstraints(
                    maxWidth: 320,
                  ),
                  margin: const EdgeInsets.symmetric(vertical: 7),
                  padding: const EdgeInsets.all(14),
                  decoration: BoxDecoration(
                    color: isUser
                        ? const Color(0xFF075B70)
                        : const Color(0xFF172438),
                    borderRadius: BorderRadius.only(
                      topLeft: const Radius.circular(18),
                      topRight: const Radius.circular(18),
                      bottomLeft: Radius.circular(isUser ? 18 : 4),
                      bottomRight: Radius.circular(isUser ? 4 : 18),
                    ),
                    border: Border.all(
                      color: isUser
                          ? const Color(0xFF00D9FF).withOpacity(0.2)
                          : Colors.white.withOpacity(0.05),
                    ),
                  ),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        isUser ? 'YOU' : 'ADIRUTI',
                        style: TextStyle(
                          fontSize: 9,
                          fontWeight: FontWeight.bold,
                          letterSpacing: 1.2,
                          color: isUser
                              ? Colors.white70
                              : const Color(0xFF00D9FF),
                        ),
                      ),
                      const SizedBox(height: 7),
                      if (isUser)
                        SelectableText(
                          text,
                          style: const TextStyle(
                            fontSize: 15,
                            height: 1.5,
                            color: Colors.white,
                          ),
                        )
                      else
                        MarkdownBody(
                          data: text,
                          selectable: true,
                          styleSheet: MarkdownStyleSheet(
                            p: const TextStyle(
                              fontSize: 15,
                              height: 1.5,
                              color: Colors.white,
                            ),
                            h1: const TextStyle(
                              fontSize: 21,
                              color: Color(0xFF00D9FF),
                              fontWeight: FontWeight.bold,
                            ),
                            h2: const TextStyle(
                              fontSize: 19,
                              color: Color(0xFF00D9FF),
                              fontWeight: FontWeight.bold,
                            ),
                            code: const TextStyle(
                              color: Color(0xFF00D9FF),
                              backgroundColor: Color(0xFF080B14),
                            ),
                          ),
                        ),
                      if (!isUser) ...[
                        const SizedBox(height: 8),
                        Row(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            IconButton(
                              visualDensity: VisualDensity.compact,
                              onPressed: () => copyResponse(text),
                              icon: const Icon(
                                Icons.copy,
                                size: 17,
                                color: Colors.white60,
                              ),
                            ),
                            IconButton(
                              visualDensity: VisualDensity.compact,
                              onPressed: () => speakResponse(text),
                              icon: const Icon(
                                Icons.volume_up,
                                size: 19,
                                color: Color(0xFF00D9FF),
                              ),
                            ),
                          ],
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }

            Widget buildImagePreview() {
              if (selectedImage == null) {
                return const SizedBox.shrink();
              }

              return Container(
                margin: const EdgeInsets.fromLTRB(12, 8, 12, 4),
                padding: const EdgeInsets.all(8),
                decoration: BoxDecoration(
                  color: const Color(0xFF172438),
                  borderRadius: BorderRadius.circular(14),
                ),
                child: Row(
                  children: [
                    ClipRRect(
                      borderRadius: BorderRadius.circular(9),
                      child: Image.file(
                        File(selectedImage!.path),
                        height: 75,
                        width: 75,
                        fit: BoxFit.cover,
                      ),
                    ),
                    const SizedBox(width: 12),
                    const Expanded(
                      child: Text(
                        'Image ready for ADIRUTI',
                        style: TextStyle(
                          color: Color(0xFF00D9FF),
                          fontSize: 12,
                        ),
                      ),
                    ),
                    IconButton(
                      onPressed: () {
                        setState(() {
                          selectedImage = null;
                        });
                      },
                      icon: const Icon(
                        Icons.close,
                        color: Colors.redAccent,
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget buildInputArea() {
              return Container(
                padding: const EdgeInsets.fromLTRB(12, 8, 12, 12),
                decoration: const BoxDecoration(
                  color: Color(0xFF0D1422),
                  border: Border(
                    top: BorderSide(
                      color: Color(0xFF1C2B40),
                    ),
                  ),
                ),
                child: SafeArea(
                  top: false,
                  child: Column(
                    children: [
                      Row(
                        children: [
                          const Text(
                            'VOICE LANGUAGE',
                            style: TextStyle(
                              fontSize: 9,
                              color: Colors.white54,
                              letterSpacing: 1,
                            ),
                          ),
                          const SizedBox(width: 8),
                          DropdownButton<String>(
                            value: selectedLanguage,
                            dropdownColor: const Color(0xFF182438),
                            underline: const SizedBox(),
                            items: const [
                              DropdownMenuItem(
                                value: 'auto',
                                child: Text('Auto / Hinglish'),
                              ),
                              DropdownMenuItem(
                                value: 'en_IN',
                                child: Text('English'),
                              ),
                              DropdownMenuItem(
                                value: 'hi_IN',
                                child: Text('Hindi'),
                              ),
                            ],
                            onChanged: (value) {
                              if (value != null) {
                                setState(() {
                                  selectedLanguage = value;
                                });
                              }
                            },
                          ),
                          const Spacer(),
                          if (loading)
                            TextButton.icon(
                              onPressed: stopGeneration,
                              icon: const Icon(Icons.stop, size: 17),
                              label: const Text('Stop'),
                            )
                          else if (status == AssistantStatus.speaking)
                            TextButton.icon(
                              onPressed: stopSpeaking,
                              icon: const Icon(Icons.stop, size: 17),
                              label: const Text('Stop'),
                            ),
                        ],
                      ),
                      buildImagePreview(),
                      Row(
                        children: [
                          IconButton(
                            onPressed: loading ? null : showImageOptions,
                            icon: const Icon(
                              Icons.add_photo_alternate_outlined,
                              color: Color(0xFF00D9FF),
                            ),
                          ),
                          Container(
                            decoration: BoxDecoration(
                              color: listening
                                  ? Colors.red.withOpacity(0.15)
                                  : const Color(0xFF182438),
                              shape: BoxShape.circle,
                            ),
                            child: IconButton(
                              onPressed: startListening,
                              icon: Icon(
                                listening ? Icons.mic : Icons.mic_none,
                                color: listening
                                    ? Colors.redAccent
                                    : const Color(0xFF00D9FF),
                              ),
                            ),
                          ),
                          const SizedBox(width: 5),
                          Expanded(
                            child: TextField(
                              controller: controller,
                              minLines: 1,
                              maxLines: 4,
                              style: const TextStyle(fontSize: 15),
                              decoration: InputDecoration(
                                hintText: 'Message ADIRUTI...',
                                filled: true,
                                fillColor: const Color(0xFF182438),
                                contentPadding:
                                    const EdgeInsets.symmetric(
                                  horizontal: 17,
                                  vertical: 13,
                                ),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(25),
                                  borderSide: BorderSide.none,
                                ),
                              ),
                              onSubmitted: (_) => sendMessage(),
                            ),
                          ),
                          const SizedBox(width: 7),
                          Container(
                            decoration: const BoxDecoration(
                              color: Color(0xFF00BBD8),
                              shape: BoxShape.circle,
                            ),
                            child: IconButton(
                              onPressed: loading ? null : sendMessage,
                              icon: Icon(
                                loading ? Icons.hourglass_top : Icons.send,
                                color: Colors.white,
                              ),
                            ),
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Column(
                    children: [
                      Padding(
                        padding: const EdgeInsets.fromLTRB(
                          15, 13, 15, 12,
                        ),
                        child: Row(
                          children: [
                            Container(
                              height: 44,
                              width: 44,
                              decoration: BoxDecoration(
                                borderRadius: BorderRadius.circular(14),
                                gradient: const LinearGradient(
                                  colors: [
                                    Color(0xFF00D9FF),
                                    Color(0xFF3156C9),
                                  ],
                                ),
                              ),
                              child: const Icon(
                                Icons.auto_awesome,
                                color: Colors.white,
                              ),
                            ),
                            const SizedBox(width: 11),
                            const Expanded(
                              child: Column(
                                crossAxisAlignment:
                                    CrossAxisAlignment.start,
                                children: [
                                  Text(
                                    'ADITECH',
                                    style: TextStyle(
                                      fontSize: 19,
                                      fontWeight: FontWeight.bold,
                                      letterSpacing: 2,
                                    ),
                                  ),
                                  Text(
                                    'ADI IDEOLOGY • IRITATOR',
                                    style: TextStyle(
                                      fontSize: 9,
                                      color: Color(0xFF00D9FF),
                                      letterSpacing: 0.8,
                                    ),
                                  ),
                                ],
                              ),
                            ),
                            IconButton(
                              tooltip: 'New Chat',
                              onPressed: newChat,
                              icon: const Icon(
                                Icons.add_comment_outlined,
                                color: Color(0xFF00D9FF),
                              ),
                            ),
                            buildStatusIndicator(),
                          ],
                        ),
                      ),
                      const Divider(
                        color: Color(0xFF1C2B40),
                        height: 1,
                      ),
                      Expanded(
                        child: messages.isEmpty
                            ? buildWelcome()
                            : ListView.builder(
                                controller: scrollController,
                                padding: const EdgeInsets.all(14),
                                itemCount: messages.length,
                                itemBuilder: (context, index) {
                                  return buildMessage(messages[index]);
                                },
                              ),
                      ),
                      if (loading)
                        const Padding(
                          padding: EdgeInsets.symmetric(
                            horizontal: 18,
                            vertical: 9,
                          ),
                          child: Row(
                            children: [
                              SizedBox(
                                height: 16,
                                width: 16,
                                child: CircularProgressIndicator(
                                  strokeWidth: 2,
                                  color: Color(0xFF00D9FF),
                                ),
                              ),
                              SizedBox(width: 10),
                              Text(
                                'ADIRUTI is thinking...',
                                style: TextStyle(
                                  color: Color(0xFF00D9FF),
                                  fontSize: 12,
                                ),
                              ),
                            ],
                          ),
                        ),
                      buildInputArea(),
                    ],
                  ),
                ),
              );
            }

            @override
            void dispose() {
              activeClient?.close(force: true);
              controller.dispose();
              scrollController.dispose();
              speech.stop();
              tts.stop();
              super.dispose();
            }
          }
          DART

      - name: Build release APK
        run: |
          cd app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADITECH-3.0-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
